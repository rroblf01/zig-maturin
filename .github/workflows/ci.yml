name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned to the Zig version the project is tested against.
env:
  ZIG_VERSION: "0.16.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/ ci/

  # Zig-side unit tests (the 45 C-API/runtime assertions). The build.zig `test`
  # step shells out via `sh`/`cp`, so it runs on the Unix runners only; Windows
  # functional coverage comes from the extension-e2e job below.
  zig-test:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 + ARM64 for Linux; macOS is Apple Silicon only (GitHub has no
        # current free Intel runner). Windows excluded: the test step needs sh/cp.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run Zig tests
        run: zig build test

  # Run the full extension test suite under Valgrind to catch C-level memory
  # leaks the refcount-stability assertions can't see. A full CPython run leaks
  # thousands of blocks of its own, so ci/check_leaks.py keeps only the blocks
  # attributable to the extension, drops the intentional one-time type metadata,
  # and fails on a *scaling* leak (the suite iterates the hot paths 20k+ times).
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build extension
        run: zig build
      - name: Run tests under Valgrind
        env:
          PYTHONMALLOC: malloc
        run: |
          cp zig-out/lib/libpyo3zig_demo.so pyo3zig_demo.so
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --num-callers=20 \
            --log-file=valgrind.log \
            python3 tests/test_pyo3zig.py
      - name: Check for extension leaks
        run: python3 ci/check_leaks.py valgrind.log
      - name: Run sub-interpreter test under Valgrind (two interpreter counts)
        env:
          PYTHONMALLOC: malloc
        run: |
          sed 's/range(100)/range(10)/' tests/test_subinterp.py > si_small.py
          sed 's/range(100)/range(80)/' tests/test_subinterp.py > si_big.py
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --num-callers=20 \
            --log-file=vg_si_small.log python3 si_small.py
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --num-callers=20 \
            --log-file=vg_si_big.log python3 si_big.py
      - name: Check sub-interpreter leak does not scale
        run: python3 ci/check_leaks.py --scaling vg_si_small.log vg_si_big.log 10 80

  # Pure-Python tooling tests (CLI, config, wheel, builder) across every
  # supported OS and Python version. No Zig needed.
  tooling-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install ".[dev]"
      - name: Run tooling tests
        run: pytest -v

  # The real cross-platform proof: build the demo extension with the tool,
  # install the wheel, and import + exercise it natively on each OS/version.
  extension-e2e:
    strategy:
      fail-fast: false
      matrix:
        # Native build + import test. x86_64 + ARM64 on Linux; macOS Apple
        # Silicon; Windows x86_64. Windows/ARM64 is covered by the cross-build
        # job below (zig.exe crashes when run natively on a Windows/ARM host).
        os:
          - ubuntu-latest        # Linux x86_64
          - ubuntu-24.04-arm     # Linux ARM64
          - macos-latest         # macOS ARM64 (Apple Silicon)
          - windows-latest       # Windows x86_64
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install zig-maturin
        run: pip install .
      - name: Build extension wheel
        run: zig-maturin build --out dist
      - name: Install built wheel
        run: pip install --find-links dist --no-index pyo3zig_demo
      - name: Smoke test imported extension
        run: python ci/smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  # The abi3 promise: one stable-ABI wheel built against a single CPython works
  # unmodified on that version AND every later one. Build a `cp312-abi3` wheel
  # once on 3.12, then install + import it on 3.12, 3.13 and 3.14. This is the
  # forward-compat proof that can't be made on a single local interpreter.
  abi3-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install zig-maturin
        run: pip install .
      - name: Build abi3 wheel (cp312-abi3)
        run: zig-maturin build --abi3 3.12 --out dist
      - name: Verify wheel is tagged cp312-abi3
        run: |
          ls dist/
          ls dist/*-cp312-abi3-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: abi3-wheel
          path: dist/*.whl

  abi3-forward-compat:
    needs: abi3-build
    strategy:
      fail-fast: false
      matrix:
        # The one cp312-abi3 wheel must import on its build version and every
        # later CPython without a rebuild.
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: abi3-wheel
          path: dist
      - name: Install the cp312-abi3 wheel
        run: pip install --find-links dist --no-index pyo3zig_demo
      - name: Smoke test imported extension
        run: python ci/smoke.py

  # NOTE: Free-threading (no-GIL, PEP 703) is NOT supported yet (deferred to a
  # future release). The C shim opts in with Py_MOD_GIL_NOT_USED, but the
  # Zig-side PyObject/PyModuleDef layouts are the regular-ABI structs; the
  # free-threaded build has a wider object header, so the module def and
  # instance layouts need a free-threaded-conditional definition before the
  # extension can load on a `python3.13t` / `python3.14t` interpreter. The CI
  # job is intentionally removed until that lands.

  # Sub-interpreters: build + install the extension, then import and exercise it
  # inside (shared-GIL) sub-interpreters. A single-phase module would raise on
  # import here, so a passing run proves the multi-phase init + per-interpreter
  # type caches work. Needs CPython 3.13+ for the `_interpreters` API.
  subinterpreters:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install zig-maturin
        run: pip install .
      - name: Build + install the extension
        run: |
          zig-maturin build --out dist
          pip install --find-links dist --no-index pyo3zig_demo
      - name: Run sub-interpreter E2E
        run: python tests/test_subinterp.py

  # Toolchain-free build: no `zig` on PATH (the runner has none and we add no
  # setup-zig step). The CLI must fall back to the `ziglang` wheel and still
  # produce a working extension — the path a bare `pip install .` takes.
  toolchain-free-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install zig-maturin + ziglang (no system Zig)
        run: pip install . "ziglang>=0.16.0,<0.17.0"
      - name: Assert no system zig
        run: 'which zig && exit 1 || echo "no system zig, as expected"'
      - name: Build via the ziglang fallback
        run: zig-maturin build --out dist
      - name: Install + smoke test
        run: |
          pip install --find-links dist --no-index pyo3zig_demo
          python ci/smoke.py

  # End-to-end exercise of the 1.0 packaging features that unit tests only cover
  # in part: mixed Python/Zig layout, PEP 660 editable installs, and the
  # generate-ci workflow generator.
  packaging-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install zig-maturin
        run: pip install . pyyaml

      - name: generate-ci produces valid YAML
        run: |
          zig-maturin generate-ci --print > wheels.yml
          python -c "import yaml; d=yaml.safe_load(open('wheels.yml')); assert set(d['jobs'])=={'wheels','sdist','publish'}, d['jobs']"

      - name: Mixed Python/Zig layout (package + nested extension)
        run: |
          # Turning src/<module>/ into a package switches the build to mixed
          # layout: the extension nests inside it and the .py files ride along.
          mkdir -p src/pyo3zig_demo
          printf 'from .pyo3zig_demo import *\nfrom .companion import tag\n' > src/pyo3zig_demo/__init__.py
          printf 'def tag():\n    return "companion-ok"\n' > src/pyo3zig_demo/companion.py
          zig-maturin build --out dist_mixed
          python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist_mixed/*.whl')[0]).namelist(); assert 'pyo3zig_demo/pyo3zig_demo.so' in n and 'pyo3zig_demo/companion.py' in n, n"
          pip install --find-links dist_mixed --no-index --force-reinstall pyo3zig_demo
          python -c "import pyo3zig_demo as m; assert m.hello().startswith('Hello'); assert m.tag()=='companion-ok'; assert m.mathx.triple(2)==6"

      - name: Editable install (PEP 660 build_editable)
        run: |
          python - <<'PY'
          import os, sys, glob, subprocess, tempfile
          from zig_maturin import buildapi
          d = tempfile.mkdtemp()
          name = buildapi.build_editable(d)
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 "--force-reinstall", os.path.join(d, name)])
          PY
          python -c "import pyo3zig_demo as m; print('editable import ok:', m.hello())"

  # Windows/ARM64 wheel, cross-compiled from a Linux x86_64 runner: zig.exe
  # segfaults when run natively on a Windows/ARM host, and an x86_64 host
  # cannot run the resulting ARM64 .pyd, so this is build-only (no import).
  windows-arm-crossbuild:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install zig-maturin
        run: pip install .
      - name: Fetch target (ARM64) Python headers + import lib
        id: pyarm
        run: python ci/fetch_windows_python.py ${{ matrix.python-version }} arm-python >> "$GITHUB_OUTPUT"
      - name: Cross-build Windows ARM64 wheel
        run: |
          zig-maturin build --target aarch64-windows-gnu \
            --python-include "${{ steps.pyarm.outputs.include }}" \
            --python-libdir "${{ steps.pyarm.outputs.libdir }}" \
            --python-lib "${{ steps.pyarm.outputs.lib }}" \
            --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-arm64-py${{ matrix.python-version }}
          path: dist/*.whl
