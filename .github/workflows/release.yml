name: Release

# zig-maturin (the CLI tool) is a pure-Python package: a single universal
# `py3-none-any` wheel + sdist. No compiled extension, so no cibuildwheel /
# manylinux / Zig matrix here — that lives in ci.yml as a functional test of
# the *demo* extension. Publishing happens on a `v*` tag via PyPI Trusted
# Publishing (OIDC); no API token/secret required.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Optionally add a `pypi` GitHub Environment here for deploy protection
    # rules; configure it to match the PyPI trusted-publisher settings.
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
