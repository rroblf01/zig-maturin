version: 2
# NOTE: Zig dependencies in build.zig.zon are not supported by Dependabot;
# bump those manually with `zig fetch --save`.
updates:
  # Python runtime + dev dependencies declared in pyproject.toml
  # ([project.dependencies] + [project.optional-dependencies]).
  # PRs are grouped per-week to keep noise low.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-deps:
        patterns:
          - "*"

  # GitHub Actions versions (uses: actions/checkout@vN, etc.) across ALL
  # workflow files under .github/workflows/ — both ci.yml and release.yml.
  # Pin bumps land alongside ecosystem-wide security advisories.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"