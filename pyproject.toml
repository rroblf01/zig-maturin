[project]
name = "zig-maturin"
version = "0.1.0"
description = "Build and publish Zig-powered Python extensions with native cross-compilation"
readme = "README.md"
authors = [
    { name = "Ricardo Robles Fernández", email = "ricardo.r.f@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = ["click>=8.0"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Zig",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/rroblf01/zig-maturin"
Repository = "https://github.com/rroblf01/zig-maturin"
Documentation = "https://github.com/rroblf01/zig-maturin"

[project.scripts]
zig-maturin = "zig_maturin.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.zig-maturin]
module-name = "pyo3zig_demo"
python-source = "src"
zig-source = "pyo3zig_example.zig"
